{% extends "base.html" %}
{% block content %}
<div class="text-center mt-5">
    <div class="success-icon">
        <i class="fas fa-check-circle"></i>
    </div>
    <h1 class="mt-4">Order Confirmed!</h1>
    <p class="lead">Thank you for your order, {{ current_user.username }}.</p>

    <div class="card mt-4 mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h5><i class="fas fa-info-circle"></i> Delivery Details</h5>
            <hr>
            <p><strong>Phone:</strong> {{ phone }}</p>
            <p><strong>Address:</strong> {{ address }}</p>
        </div>
    </div>

    <div class="alert alert-primary mt-4">
        <h3><i class="fas fa-clock"></i> Your order will be delivered in 30 minutes!</h3>
    </div>

    <a href="{{ url_for('home') }}" class="btn btn-primary btn-lg mt-3">
        <i class="fas fa-home"></i> Back to Home
    </a>
</div>
{% endblock %}
